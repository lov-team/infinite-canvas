# video.lovbrowser.com -> Infinite Canvas static frontend.
# DNS: add a proxied Cloudflare CNAME (video -> lovbrowser.com).
# The origin certificate is shared with the LovBrowser sites.
server {
    listen 80;
    server_name video.lovbrowser.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name video.lovbrowser.com;

    ssl_certificate /etc/ssl/lovbrowser/lovbrowser.com.pem;
    ssl_certificate_key /etc/ssl/lovbrowser/lovbrowser.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
